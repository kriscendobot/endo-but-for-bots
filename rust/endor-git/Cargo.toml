[package]
name = "endor-git"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Narrow libgit2 storage bindings shared by Endor and Minion Town"

[dependencies]
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2", "unstable-sha256"] }
libc = "0.2"
libgit2-sys = { version = "=0.18.8", default-features = false, features = ["vendored", "unstable-sha256"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "endor-git-link-audit"
path = "examples/endor-git-link-audit.rs"
