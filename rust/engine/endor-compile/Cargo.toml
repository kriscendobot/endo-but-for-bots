[package]
name = "endor-compile"
description = "Oracle-locked transliteration of the XS compiler (lexer -> parser -> scoper -> coder). Stage 5 of the XS->Rust port; replaces the oracle compiler behind a byte-identical-bytecode bar."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "endor_compile"
path = "src/lib.rs"

[dev-dependencies]
# The conformance oracle (C-XS at the pin), used only by the whole-corpus
# parse-smoke integration test to certify accept/reject agreement.
endor-oracle = { path = "../endor-oracle" }
