[package]
name = "endor-regexp"
description = "Safe transliteration of the XS RegExp engine (xsre.c): the pattern compiler (parser + measure + code emission) and the backtracking match VM, engine-internal (no JavaScript surface). Metering-exact and bit-exact against the c/moddable pin. #![forbid(unsafe_code)]."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "endor_regexp"
path = "src/lib.rs"

[dev-dependencies]
endor-oracle = { path = "../endor-oracle" }
